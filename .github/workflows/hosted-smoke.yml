name: hosted-smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-hosted:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: python3 --version && node --version
      - name: Guard canonical shared Web assets
        run: python3 scripts/check_canonical_web_sync.py
      - run: python3 -m py_compile apps/web/hosted_app.py apps/web/identity.py apps/web/mail.py testamur/web_app.py
      - name: Syntax-check shared Web JavaScript
        run: |
          node --check testamur/web/app.js
          node --check testamur/web/contextual-guide.js
          node --check testamur/web/demo-handoff.js
          node --check testamur/web/supply-chain-guidance.js
          node --check testamur/web/advisory-review-ui.js
          node --check testamur/web/advisory-revalidation-ui.js
      - run: python3 -m unittest tests.test_email_verification tests.test_hosted_onboarding_web_contract

  compile-mathhub:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: python3 --version && node --version
      - run: python3 -m py_compile mathhub_app/mathhub.py mathhub_app/server.py mathhub_app/source_ingest.py
      - run: node --check mathhub_app/source-ingest-ui.js
      - name: Run hosted MathHub snapshot tests
        run: |
          rm -rf .venv-ci
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check pytest
          .venv-ci/bin/python -m pytest -q tests/test_hosted_mathhub_snapshot.py

  signup-smoke:
    runs-on: self-hosted
    needs: compile-hosted
    env:
      SMOKE_ROOT: ${{ runner.temp }}/testamur-signup-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: python3 --version
      - name: Start hosted Testamur
        run: |
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT/data"
          python3 -m apps.web.hosted_app \
            --host 127.0.0.1 \
            --port 8788 \
            --data-dir "$SMOKE_ROOT/data" \
            --no-monitor-scheduler >"$SMOKE_ROOT/testamur.log" 2>&1 &
          echo $! >"$SMOKE_ROOT/testamur.pid"
      - name: Wait and verify signup fails closed without mail configuration
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS -H 'Host: testamur.org' http://127.0.0.1:8788/signup >/dev/null
          status="$(
            curl -sS -o "$SMOKE_ROOT/signup-response.json" -w '%{http_code}' \
              -H 'Host: testamur.org' \
              -H 'Content-Type: application/json' \
              -d '{"username":"smoke-user","email":"smoke@example.test","password":"smoke-password-123"}' \
              http://127.0.0.1:8788/v1/account/signup
          )"
          test "$status" = "503"
          python3 -c 'import json,os; b=json.load(open(os.path.join(os.environ["SMOKE_ROOT"],"signup-response.json"))); assert b["error"]["code"] == "email_delivery_unavailable", b'
      - if: failure()
        run: cat "$SMOKE_ROOT/testamur.log" || true
      - name: Clean up signup smoke
        if: always()
        run: |
          if [ -f "$SMOKE_ROOT/testamur.pid" ]; then
            kill "$(cat "$SMOKE_ROOT/testamur.pid")" 2>/dev/null || true
          fi
          rm -rf "$SMOKE_ROOT"

  mathhub-proxy-smoke:
    runs-on: self-hosted
    needs: [compile-hosted, compile-mathhub]
    env:
      PROXY_ROOT: ${{ runner.temp }}/testamur-proxy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: python3 --version
      - name: Start MathHub and hosted gateway
        run: |
          rm -rf "$PROXY_ROOT"
          mkdir -p "$PROXY_ROOT/mathhub" "$PROXY_ROOT/testamur"
          (
            cd mathhub_app
            MATHHUB_HOST=127.0.0.1 MATHHUB_PORT=8001 MATHHUB_DATA_DIR="$PROXY_ROOT/mathhub" \
              python3 mathhub.py >"$PROXY_ROOT/mathhub.log" 2>&1 &
            echo $! >"$PROXY_ROOT/mathhub.pid"
          )
          python3 -m apps.web.hosted_app \
            --host 127.0.0.1 \
            --port 8788 \
            --data-dir "$PROXY_ROOT/testamur" \
            --no-monitor-scheduler >"$PROXY_ROOT/testamur.log" 2>&1 &
          echo $! >"$PROXY_ROOT/testamur.pid"
      - name: Exercise proxied MathHub surface
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/sources/mathhub/ >/dev/null 2>&1; then exit 0; fi
            sleep 0.25
          done
          cat "$PROXY_ROOT/mathhub.log" || true
          cat "$PROXY_ROOT/testamur.log" || true
          exit 1
      - if: failure()
        run: |
          cat "$PROXY_ROOT/mathhub.log" || true
          cat "$PROXY_ROOT/testamur.log" || true
      - name: Clean up proxy smoke
        if: always()
        run: |
          for pidfile in "$PROXY_ROOT/testamur.pid" "$PROXY_ROOT/mathhub.pid"; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done
          rm -rf "$PROXY_ROOT"
