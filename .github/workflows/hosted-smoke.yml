name: hosted-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile critical Python entrypoints
        run: |
          python -m py_compile \
            apps/web/hosted_app.py \
            apps/web/identity.py \
            testamur/web_app.py \
            mathhub_app/mathhub.py \
            mathhub_app/server.py

      - name: Start bundled MathHub
        run: |
          mkdir -p /tmp/mathhub
          (
            cd mathhub_app
            MATHHUB_HOST=127.0.0.1 \
            MATHHUB_PORT=8001 \
            MATHHUB_DATA_DIR=/tmp/mathhub \
              python mathhub.py >/tmp/mathhub.log 2>&1 &
            echo $! >/tmp/mathhub.pid
          )

      - name: Start hosted Testamur
        run: |
          mkdir -p /tmp/testamur
          python -m apps.web.hosted_app \
            --host 127.0.0.1 \
            --port 8788 \
            --data-dir /tmp/testamur \
            --no-monitor-scheduler >/tmp/testamur.log 2>&1 &
          echo $! >/tmp/testamur.pid

      - name: Wait for services
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/testamur.log || true
          cat /tmp/mathhub.log || true
          exit 1

      - name: Smoke hosted routes and signup
        run: |
          curl -fsS -H 'Host: testamur.org' http://127.0.0.1:8788/healthz
          curl -fsS -H 'Host: testamur.org' http://127.0.0.1:8788/signup >/dev/null
          curl -fsS -H 'Host: testamur.org' http://127.0.0.1:8788/sources/mathhub/ >/dev/null

          response="$(
            curl -fsS \
              -H 'Host: testamur.org' \
              -H 'Content-Type: application/json' \
              -d '{"username":"smoke-user","email":"smoke@example.test","password":"smoke-password-123"}' \
              http://127.0.0.1:8788/v1/account/signup
          )"
          python -c 'import json,sys; body=json.loads(sys.argv[1]); assert body.get("ok") is True and body.get("authenticated") is True, body' "$response"

      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/testamur.log || true
          cat /tmp/mathhub.log || true
