name: hosted-smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Constanteer/testamur
          path: canonical-testamur
      - name: Guard canonical shared Web assets
        run: |
          for asset in index.html contextual-guide.js contextual-guide.css demo-handoff.js demo-handoff.css supply-chain-guidance.js supply-chain-guidance.css; do
            cmp "canonical-testamur/testamur/web/$asset" "testamur/web/$asset" || {
              echo "Hosted shared Web asset drifted from canonical Testamur: $asset" >&2
              exit 1
            }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m py_compile apps/web/hosted_app.py apps/web/identity.py apps/web/mail.py testamur/web_app.py
      - run: node --check testamur/web/app.js testamur/web/contextual-guide.js testamur/web/demo-handoff.js testamur/web/supply-chain-guidance.js
      - run: python -m unittest tests.test_email_verification tests.test_hosted_onboarding_web_contract

  compile-mathhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile mathhub_app/mathhub.py mathhub_app/server.py

  signup-smoke:
    runs-on: ubuntu-latest
    needs: compile-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start hosted Testamur
        run: |
          mkdir -p /tmp/testamur
          python -m apps.web.hosted_app \
            --host 127.0.0.1 \
            --port 8788 \
            --data-dir /tmp/testamur \
            --no-monitor-scheduler >/tmp/testamur.log 2>&1 &
          echo $! >/tmp/testamur.pid
      - name: Wait and verify signup fails closed without mail configuration
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS -H 'Host: testamur.org' http://127.0.0.1:8788/signup >/dev/null
          status="$(
            curl -sS -o /tmp/signup-response.json -w '%{http_code}' \
              -H 'Host: testamur.org' \
              -H 'Content-Type: application/json' \
              -d '{"username":"smoke-user","email":"smoke@example.test","password":"smoke-password-123"}' \
              http://127.0.0.1:8788/v1/account/signup
          )"
          test "$status" = "503"
          python -c 'import json; b=json.load(open("/tmp/signup-response.json")); assert b["error"]["code"] == "email_delivery_unavailable", b'
      - if: failure()
        run: cat /tmp/testamur.log || true

  mathhub-proxy-smoke:
    runs-on: ubuntu-latest
    needs: [compile-hosted, compile-mathhub]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start MathHub and hosted gateway
        run: |
          mkdir -p /tmp/mathhub /tmp/testamur
          (
            cd mathhub_app
            MATHHUB_HOST=127.0.0.1 MATHHUB_PORT=8001 MATHHUB_DATA_DIR=/tmp/mathhub \
              python mathhub.py >/tmp/mathhub.log 2>&1 &
            echo $! >/tmp/mathhub.pid
          )
          python -m apps.web.hosted_app \
            --host 127.0.0.1 \
            --port 8788 \
            --data-dir /tmp/testamur \
            --no-monitor-scheduler >/tmp/testamur.log 2>&1 &
          echo $! >/tmp/testamur.pid
      - name: Exercise proxied MathHub surface
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/sources/mathhub/ >/dev/null 2>&1; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/mathhub.log || true
          cat /tmp/testamur.log || true
          exit 1
      - if: failure()
        run: |
          cat /tmp/mathhub.log || true
          cat /tmp/testamur.log || true
