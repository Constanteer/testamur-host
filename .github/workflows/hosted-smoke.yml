name: hosted-smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: 'bash --noprofile --norc -eo pipefail "{0}"'

jobs:
  compile-hosted:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: python3 --version && node --version
      - name: Guard canonical shared Web assets
        run: python3 scripts/check_canonical_web_sync.py
      - run: python3 -m py_compile apps/web/hosted_app.py apps/web/identity.py apps/web/mail.py testamur/web_app.py
      - name: Syntax-check shared Web JavaScript
        run: |
          node --check testamur/web/app.js
          node --check testamur/web/contextual-guide.js
          node --check testamur/web/demo-handoff.js
          node --check testamur/web/supply-chain-guidance.js
          node --check testamur/web/advisory-review-ui.js
          node --check testamur/web/advisory-revalidation-ui.js
      - run: >-
          python3 -m unittest
          tests.test_email_verification
          tests.test_mail_backend_configuration
          tests.test_mail_origin_validation
          tests.test_hosted_onboarding_web_contract

  compile-mathhub:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile mathhub_app/mathhub.py mathhub_app/server.py mathhub_app/source_ingest.py
      - run: node --check mathhub_app/source-ingest-ui.js
      - name: Run hosted MathHub snapshot tests
        run: |
          rm -rf .venv-ci
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check pytest
          .venv-ci/bin/python -m pytest -q tests/test_hosted_mathhub_snapshot.py

  signup-smoke:
    runs-on: self-hosted
    needs: compile-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Start hosted Testamur
        run: |
          mkdir -p /tmp/testamur
          python3 -m apps.web.hosted_app \
            --host 127.0.0.1 \
            --port 8788 \
            --data-dir /tmp/testamur \
            --no-monitor-scheduler >/tmp/testamur.log 2>&1 &
          echo $! >/tmp/testamur.pid
      - name: Wait and verify signup fails closed without mail configuration
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS -H 'Host: testamur.org' http://127.0.0.1:8788/signup >/dev/null
          status="$(
            curl -sS -o /tmp/signup-response.json -w '%{http_code}' \
              -H 'Host: testamur.org' \
              -H 'Content-Type: application/json' \
              -d '{"username":"smoke-user","email":"smoke@example.test","password":"smoke-password-123"}' \
              http://127.0.0.1:8788/v1/account/signup
          )"
          test "$status" = "503"
          python3 -c 'import json; b=json.load(open("/tmp/signup-response.json")); assert b["error"]["code"] == "email_delivery_unavailable", b'
      - if: failure()
        run: cat /tmp/testamur.log || true

  mathhub-proxy-smoke:
    runs-on: self-hosted
    needs: [compile-hosted, compile-mathhub]
    steps:
      - uses: actions/checkout@v4
      - name: Start MathHub and hosted gateway
        run: |
          mkdir -p /tmp/mathhub /tmp/testamur
          (
            cd mathhub_app
            MATHHUB_HOST=127.0.0.1 MATHHUB_PORT=8001 MATHHUB_DATA_DIR=/tmp/mathhub \
              python3 mathhub.py >/tmp/mathhub.log 2>&1 &
            echo $! >/tmp/mathhub.pid
          )
          python3 -m apps.web.hosted_app \
            --host 127.0.0.1 \
            --port 8788 \
            --data-dir /tmp/testamur \
            --no-monitor-scheduler >/tmp/testamur.log 2>&1 &
          echo $! >/tmp/testamur.pid
      - name: Exercise proxied MathHub surface
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/sources/mathhub/ >/dev/null 2>&1; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/mathhub.log || true
          cat /tmp/testamur.log || true
          exit 1
      - if: failure()
        run: |
          cat /tmp/mathhub.log || true
          cat /tmp/testamur.log || true
          exit 1
